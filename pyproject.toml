[project]
name = "edge-lab"
version = "0.1.0"
description = "Edge detection from first principles: gradients, Laplacian/LoG zero-crossings, Canny's NMS + hysteresis, and the structure tensor — each measured rather than asserted."
requires-python = ">=3.10"
dependencies = [
    # Same 5.x pin as sfm-from-scratch. Only main-module APIs are used here
    # (Sobel, GaussianBlur, Laplacian, Canny, connectedComponents, CLAHE).
    "opencv-python>=5.0.0,<6.0.0",
    "numpy>=1.26",
    "click>=8.1",
    "loguru>=0.7",
    "matplotlib>=3.8",
]

[project.scripts]
edge-download = "edge_lab.cli.download:download"
edge-experiments = "edge_lab.cli.experiments:experiments"
edge-figures = "edge_lab.cli.figures:figures"
edge-covers = "edge_lab.cli.covers:covers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_lab"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["edge_lab"]
