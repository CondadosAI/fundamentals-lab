[project]
name = "fundamentals-lab"
version = "0.1.0"
description = "Companion code for the CondadosAI Fundamentals track: one unit per module, every published number reproducible from here."
requires-python = ">=3.10"
dependencies = [
    # Same 5.x pin as sfm-from-scratch. Only main-module APIs are used here
    # (Sobel, GaussianBlur, Laplacian, Canny, connectedComponents, CLAHE).
    "opencv-python>=5.0.0,<6.0.0",
    "numpy>=1.26",
    "click>=8.1",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "remotezip>=0.12.6",
]

[project.optional-dependencies]
# Unit 1.2 only. RAW decoding drags in LibRaw, and a reader who came for the edge
# material should not have to build it: `uv sync --extra sensing` opts in.
sensing = [
    "rawpy>=0.21",
    "exifread>=3.0",
    "xlrd>=2.0", # the survey's measurement tables are BIFF .xls
    "openexr>=3.2",
    # Unit 1.3 compares OpenCV's decoders against Pillow's, so Pillow is a declared
    # dependency here rather than something inherited from matplotlib by accident.
    "pillow>=10.0",
]

[project.scripts]
edge-download = "fundamentals_lab.cli.download:download"
edge-experiments = "fundamentals_lab.cli.experiments:experiments"
edge-figures = "fundamentals_lab.cli.figures:figures"
edge-covers = "fundamentals_lab.cli.covers:covers"
edge-media = "fundamentals_lab.cli.edge_media:edge_media"
sensing-download = "fundamentals_lab.cli.sensing_download:sensing_download"
formation-download = "fundamentals_lab.cli.formation_download:formation_download"
formation-calibrate = "fundamentals_lab.cli.formation_calibrate:calibrate"
formation-project = "fundamentals_lab.cli.formation_project:project"
formation-covers = "fundamentals_lab.cli.formation_covers:formation_covers"
formation-distort = "fundamentals_lab.cli.formation_distort:distort"
formation-dof = "fundamentals_lab.cli.formation_dof:dof"
formation-fisheye = "fundamentals_lab.cli.formation_fisheye:fisheye"
formation-media = "fundamentals_lab.cli.formation_media:formation_media"
sensing-inspect = "fundamentals_lab.cli.sensing_inspect:sensing_inspect"
sensing-experiments = "fundamentals_lab.cli.sensing_experiments:sensing_experiments"
sensing-figures = "fundamentals_lab.cli.sensing_figures:sensing_figures"
sensing-covers = "fundamentals_lab.cli.sensing_covers:sensing_covers"
sensing-media = "fundamentals_lab.cli.sensing_media:sensing_media"
data-experiments = "fundamentals_lab.cli.data_experiments:data_experiments"
data-figures = "fundamentals_lab.cli.data_figures:data_figures"
data-covers = "fundamentals_lab.cli.data_covers:data_covers"
data-media = "fundamentals_lab.cli.data_media:data_media"
align-experiments = "fundamentals_lab.cli.align_experiments:align_experiments"
align-figures = "fundamentals_lab.cli.align_figures:align_figures"
align-download = "fundamentals_lab.cli.align_download:align_download"
align-notebook = "fundamentals_lab.cli.align_notebook:align_notebook"
align-media = "fundamentals_lab.cli.align_media:align_media"
openings-media = "fundamentals_lab.cli.openings_media:openings_media"
boundary-download = "fundamentals_lab.cli.boundary_download:boundary_download"
boundary-experiments = "fundamentals_lab.cli.boundary_experiments:boundary_experiments"
boundary-media = "fundamentals_lab.cli.boundary_media:boundary_media"
boundary-figures = "fundamentals_lab.cli.boundary_figures:boundary_figures"
boundary-notebook = "fundamentals_lab.cli.boundary_notebook:boundary_notebook"
practice-m1 = "fundamentals_lab.cli.practice_m1:practice_m1"
practice-m2 = "fundamentals_lab.cli.practice_m2:practice_m2"
practice-notebook = "fundamentals_lab.cli.practice_notebook:practice_notebook"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundamentals_lab"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fundamentals_lab"]
